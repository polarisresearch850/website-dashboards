<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polaris Pacific Market Dashboard</title>

<!--
  ============================================================
  SINGLE-MARKET VIEWER (no header, no market switching)

  Each link opens exactly one dashboard, picked by ?m=<key>:
    https://<user>.github.io/<repo>/?m=sf
    https://<user>.github.io/<repo>/?m=seattle

  EDIT THESE TWO THINGS ONLY:
  1. BASE_URL = where the dashboard files live.
     - Leave "" if you copy the dashboard .html files into THIS repo.
     - Or point at your existing dashboards repo so you only maintain
       the files in one place, e.g.
       "https://<user>.github.io/<existing-repo>/"
  2. DASHBOARDS = key (used in the link) -> file name.
  ============================================================
-->
<script>
  const SITE_TITLE = "Polaris Pacific Market Dashboard";
  const BASE_URL = "";

  const DASHBOARDS = {
    // Bay Area
    "sf":               { file: "sf-condo-market-dashboards-live.html",                 label: "San Francisco" },
    "sf-d9":            { file: "sf-district-9-attached-market-dashboards-live.html",    label: "San Francisco (District 9)" },
    "oakland":          { file: "oe-attached-market-dashboards-live.html",               label: "Oakland / East Bay" },
    "silicon-valley":   { file: "sv-attached-market-dashboards-live.html",               label: "Silicon Valley" },
    "san-jose":         { file: "sj-attached-market-dashboards-live.html",               label: "San Jose" },
    // Southern California
    "la":               { file: "la-attached-market-dashboards-live.html",               label: "Los Angeles" },
    "downtown-la":      { file: "downtown-la-attached-market-dashboards-live.html",      label: "Downtown LA" },
    "oc":               { file: "oc-attached-market-dashboards-live.html",               label: "Orange County" },
    "oc-d4":            { file: "oc-district-4-attached-market-dashboards-live.html",    label: "Orange County (District 4)" },
    "san-diego":        { file: "sd-attached-market-dashboards-live.html",               label: "San Diego" },
    // Pacific Northwest
    "seattle":          { file: "se-condo-market-dashboards-live.html",                  label: "Seattle" },
    "downtown-seattle": { file: "downtown-seattle-attached-market-dashboards-live.html", label: "Downtown Seattle" },
    "bellevue":         { file: "be-attached-market-dashboards-live.html",               label: "Bellevue" },
    // Southwest
    "phoenix":          { file: "px-attached-market-dashboards-live.html",               label: "Phoenix" },
    // Mountain
    "denver":           { file: "de-attached-market-dashboards-live.html",               label: "Denver" }
  };
</script>

<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #ffffff;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #000000;
    -webkit-font-smoothing: antialiased;
  }
  iframe {
    width: 100%;
    height: 100vh;
    border: 0;
    display: block;
    background: #fff;
  }
  .empty {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #666666;
    font-size: 14px;
    text-align: center;
    padding: 24px;
    border-top: 3px solid #ee2127;
  }
</style>
</head>
<body>
  <iframe id="frame" title="Dashboard" style="display:none;"></iframe>
  <div class="empty" id="empty" style="display:none;">Dashboard not found.</div>

<script>
  (function () {
    const frame = document.getElementById("frame");
    const empty = document.getElementById("empty");
    const key = (new URLSearchParams(location.search).get("m") || "").trim().toLowerCase();
    const d = DASHBOARDS[key];

    if (!d) {
      document.title = SITE_TITLE;
      empty.style.display = "flex";
      return;
    }

    document.title = d.label + " | " + SITE_TITLE;
    frame.title = d.label + " Dashboard";
    frame.src = BASE_URL + d.file;
    frame.style.display = "block";
  })();
</script>
</body>
</html>
